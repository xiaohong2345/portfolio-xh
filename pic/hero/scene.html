    <meta charset="utf-8" />

    <title>流星窗景动画</title>
    <style>
      :root { color-scheme: dark; background: #0F1110; --header-clearance: clamp(150px, 21vh, 170px); }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #0F1110; }
      main {
        position: fixed;
        bottom: -16px;
        left: 50%;
        width: 105vw;
        height: calc(100dvh - var(--header-clearance));
        transform: translateX(-50%);
      }
      main > svg { display: block; width: 100%; height: 100%; }
      .window-line, .sill-line {
        fill: none;
        stroke: #d0dce9;
        stroke-width: 1.12;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 3px rgba(220, 236, 255, .67))
          drop-shadow(0 0 6px rgba(220, 236, 255, .32));
      }
      .window-line, .sill-line { opacity: 1; }
      .bottle-body {
        fill: #424242;
        fill-opacity: .2;
        stroke: #d0dce9;
        stroke-width: 1.12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bottle-rim {
        fill: none;
        stroke: #d0dce9;
        stroke-width: 1;
        stroke-linecap: round;
      }
    </style>
  </head>

    </main>

    <script>
      (() => {
        'use strict';

        const NS = 'http://www.w3.org/2000/svg';
        const sceneSvg = document.querySelector('main > svg');
        const layer = document.querySelector('#meteor-layer');
        const approachLayer = document.querySelector('#approach-layer');
        const sillMeteorLayer = document.querySelector('#sill-meteor-layer');
        const curveWhite = document.querySelector('#capture-curve-white');
        const curveYellow = document.querySelector('#capture-curve-yellow');
        const curveOrange = document.querySelector('#capture-curve-orange');
        const svgDefs = document.querySelector('svg defs');
        const bottleScene = document.querySelector('#bottle-scene');
        const bottleContent = document.querySelector('#bottle-content');
        const sandBed = document.querySelector('#sand-bed');
        const buriedPieces = document.querySelector('#buried-pieces');
        const sandFront = document.querySelector('#sand-front');
        const pileHalo = document.querySelector('#pile-halo');
        const sandGrains = document.querySelector('#sand-grains');
        const surfaceStars = document.querySelector('#surface-stars');
        const sparkleMarks = [...document.querySelectorAll('#pile-sparkles path')];
        const rabbitFrames = [...document.querySelectorAll('#rabbit-scene .rabbit-frame')];
        const linePaths = [...document.querySelectorAll('.window-line, .sill-line')];
        const RABBIT_SEQUENCE = [0, 1, 2, 1, 0, 1, 2, 1, 0];
        const RABBIT_FRAME_SECONDS = .18;
        let rabbitSequenceIndex = 0;
        let rabbitFrameElapsed = 0;
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        const meteors = [];
        const stars = [];
        const fragments = [];
        const grains = [];
        const sandTransfers = [];
        // 调整这里：普通（蓝白色）流星的数量；金色过境流星一次最多 1 颗。
        const NORMAL_METEOR_COUNT = 130;
        const WARM_METEOR_COUNT = 1;
        const MAX_STARS = 40;
        const CAPTURE_RATE_MULTIPLIER = 1.3;
        const OPENING_CAPTURES = [
          { at: 0, kind: 'wide' },
          { at: .3, kind: 'wide' },
          { at: 2.45, kind: 'near' },
          { at: 2.8, kind: 'wide' }
        ];
        const SAND_LEFT = 565;
        const SAND_RIGHT = 654;
        const SAND_FLOOR = 426;
        const sandHeights = Array(31).fill(0);
        const SAND_STEP = (SAND_RIGHT - SAND_LEFT) / (sandHeights.length - 1);
        const PHYSICS_STEP = 1 / 120;
        const CAPTURE_TRAIL_TIME = .25;
        const SILL_STAR_HOLD = 2.5;
        const SILL_STAR_FADE = .55;
        let frame = 0;
        let pausedByHost = false;
        let previousTime = 0;
        let previousSillTime = 0;
        let physicsRemainder = 0;
        let sceneTime = 0;
        let sillClock = 0;
        const captures = [];
        let nextCapture = 2.2 / CAPTURE_RATE_MULTIPLIER;
        let captureWave = 0;
        let openingCaptureIndex = 0;
        let openingLandings = 0;
        let openingCapturesActive = !reducedMotion.matches;
        let pairDelay = -1;
        let pairKind = 'wide';
        let captureGradientId = 0;
        let shakeTime = 0;
        let shakeDuration = .24;
        let shakeSide = 1;
        let shakeStrength = 1;
        let nextSillMeteorAt = null;
        let nextSillDuration = 1.15;
        let nextSillSide = 'left';
        let sillMeteor = null;
        let sillStar = null;

        const random = (min, max) => min + Math.random() * (max - min);
        const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
        const mix = (a, b, t) => a + (b - a) * t;
        const cubic = (a, b, c, d, t) => (1 - t) ** 3 * a + 3 * (1 - t) ** 2 * t * b
          + 3 * (1 - t) * t ** 2 * c + t ** 3 * d;
        const smooth = (t) => t * t * (3 - 2 * t);

        function leftSillPosition(targetX, targetY, t) {
          if (t <= .5) {
            const progress = t * 2;
            return {
              x: cubic(targetX + 440, targetX + 350, targetX + 230, targetX + 180, progress),
              y: cubic(-6, 35, 100, 140, progress)
            };
          }
          const progress = (t - .5) * 2;
          return {
            x: cubic(targetX + 180, targetX + 130, targetX + 60, targetX, progress),
            y: cubic(140, 180, 330, targetY, progress)
          };
        }

        function scheduleSillMeteor(fromTime) {
          nextSillDuration = random(1.05, 1.25);
          nextSillMeteorAt = fromTime + random(4, 6) - nextSillDuration;
        }

        const outCubic = (t) => 1 - (1 - t) ** 3;
        // Three hand-drawn poses, timed with the rabbit. Endpoints and sill junctions stay fixed.
        const linePosePaths = linePaths.map((path, index) => {
          const original = path.getAttribute('d');
          const coordinates = [...original.matchAll(/-?\d*\.?\d+/g)].map(match => Number(match[0]));
          const vertical = index === 0 || index === 2;
          const fixedAlong = [
            [11, 402], [137.6, 1145.3], [11, 402], [2, 137.8, 1144.8, 1275]
          ][index];
          const detailZones = [
            [[111, 35], [243, 35], [359, 30]],
            [[265, 45], [527, 55], [780, 50], [1042, 45]],
            [[93, 32], [195, 33], [310, 33]],
            [[88, 34], [268, 38], [478, 42], [754, 43], [1007, 40], [1219, 35]]
          ][index];
          const drawPose = phase => {
            let coordinateIndex = 0;
            return original.replace(/-?\d*\.?\d+/g, value => {
              const pair = Math.floor(coordinateIndex / 2) * 2;
              const along = coordinates[pair + (vertical ? 1 : 0)];
              const perpendicular = (coordinateIndex++ % 2 === 0) === vertical;
              if (!perpendicular || fixedAlong.some(anchor => Math.abs(along - anchor) < .001)) return value;
              const envelope = Math.max(...detailZones.map(([center, radius]) => {
                const distance = Math.abs(along - center) / radius;
                return distance < 1 ? (1 - distance * distance) ** 2 : 0;
              }));
              if (!envelope) return value;
              const progress = clamp((along - fixedAlong[0]) / (fixedAlong.at(-1) - fixedAlong[0]), 0, 1);
              const wave = .6 * Math.sin(progress * Math.PI * 6 + phase + index * .7)
                + .4 * Math.sin(progress * Math.PI * 11 + phase * 1.4 + index);
              return (Number(value) + 1.7 * envelope * wave).toFixed(2);
            });
          };
          return [original, drawPose(.4), drawPose(2.5)];
        });

        function svgElement(name, attributes) {
          const element = document.createElementNS(NS, name);
          for (const [key, value] of Object.entries(attributes)) {
            element.setAttribute(key, String(value));
          }
          return element;
        }

        function makeMeteor(strength) {
          const faint = strength === 'faint';
          const strong = strength === 'strong';
          const warm = strength === 'warm';
          const meteor = {
            strength,
            x: 0,
            y: 0,
            active: !warm,
            cooldown: warm ? random(2.5, 5.5) : 0,
            speed: faint ? random(105, 270) : strong ? random(380, 640) : warm ? random(690, 940) : random(220, 450),
            slope: warm ? random(.12, .245) : .175,
            length: faint ? random(90, 238) : strong ? random(80, 175) : warm ? random(105, 145) : random(75, 185),
            brightness: faint ? random(.28, .5) : strong ? random(.76, .92) : warm ? random(.8, .93) : random(.52, .74)
          };

          const group = svgElement('g', { opacity: meteor.brightness.toFixed(2) });
          if (warm) {
            const hue = Math.random() < .55 ? 'yellow' : 'orange';
            const whiteGroup = svgElement('g', { opacity: '1' });
            const warmGroup = svgElement('g', { opacity: '0' });
            whiteGroup.append(
              svgElement('path', { d: `M 0 -.8 L ${meteor.length.toFixed(1)} 0 L 0 .8 Z`, fill: 'url(#meteor-tail)', opacity: '.48', filter: 'url(#tail-glow)' }),
              svgElement('circle', { cx: 0, cy: 0, r: 11, fill: 'url(#white-halo)' }),
              svgElement('path', { d: `M 0 -.8 L ${meteor.length.toFixed(1)} 0 L 0 .8 Z`, fill: 'url(#meteor-tail)' }),
              svgElement('circle', { cx: 0, cy: 0, r: 1.55, fill: '#f7fbff' })
            );
            warmGroup.append(
              svgElement('path', { d: `M 0 -1.1 L ${meteor.length.toFixed(1)} 0 L 0 1.1 Z`, fill: `url(#capture-tail-${hue})`, opacity: '.5', filter: 'url(#tail-glow)' }),
              svgElement('circle', { cx: 0, cy: 0, r: 13, fill: `url(#${hue}-halo)` }),
              svgElement('path', { d: `M 0 -1.1 L ${meteor.length.toFixed(1)} 0 L 0 1.1 Z`, fill: `url(#capture-tail-${hue})` }),
              svgElement('circle', { cx: 0, cy: 0, r: 1.75, fill: hue === 'yellow' ? '#f2e7b4' : '#edcd9c' })
            );
            group.append(whiteGroup, warmGroup);
            meteor.whiteGroup = whiteGroup;
            meteor.warmGroup = warmGroup;
            meteor.colorDuration = random(.38, .65);
            meteor.colorTime = random(0, meteor.colorDuration);
          } else {
            const halfWidth = faint ? random(.22, .44) : strong ? random(.62, .9) : random(.42, .68);
            const shape = `M 0 ${(-halfWidth).toFixed(2)} L ${meteor.length.toFixed(1)} 0 L 0 ${halfWidth.toFixed(2)} Z`;
            const tail = svgElement('path', { d: shape, fill: 'url(#meteor-tail)' });
            const head = svgElement('circle', {
              cx: 0, cy: 0,
              r: faint ? random(.6, 1) : strong ? random(1.2, 1.7) : random(.9, 1.4),
              fill: strong && Math.random() < .16 ? '#fff0c7' : '#ffffff'
            });
            if (strong) {
              group.append(
                svgElement('path', { d: shape, fill: 'url(#meteor-tail)', opacity: '.42', filter: 'url(#tail-glow)' }),
                svgElement('circle', { cx: 0, cy: 0, r: 9, fill: 'url(#white-halo)' })
              );
            } else {
              group.append(svgElement('circle', { cx: 0, cy: 0, r: faint ? 5 : 7, fill: 'url(#white-halo)' }));
            }
            group.append(tail, head);
          }
          layer.append(group);
          meteor.group = group;
          meteor.angle = -Math.atan(meteor.slope) * 180 / Math.PI;
          meteors.push(meteor);
          placeMeteor(meteor, 'initial');
          if (warm) group.setAttribute('display', 'none');
        }

        function positionMeteor(meteor) {
          meteor.group.setAttribute(
            'transform',
            `translate(${meteor.x.toFixed(1)} ${meteor.y.toFixed(1)}) rotate(${meteor.angle.toFixed(2)})${meteor.strength === 'warm' ? ' scale(1.14)' : ''}`
          );
          if (meteor.strength === 'warm') {
            const tint = smooth(clamp(meteor.colorTime / meteor.colorDuration, 0, 1));
            meteor.whiteGroup.setAttribute('opacity', (1 - tint).toFixed(3));
            meteor.warmGroup.setAttribute('opacity', tint.toFixed(3));
          }
        }

        function placeMeteor(meteor, edge) {
          meteor.slope = meteor.strength === 'warm' ? random(.12, .245) : .175;
          meteor.angle = -Math.atan(meteor.slope) * 180 / Math.PI;
          if (edge === 'initial') {
            meteor.x = meteor.strength === 'warm' ? random(720, 1144) : random(140, 1144);
            meteor.y = meteor.strength === 'warm' ? random(0, 270) : random(0, 400);
          } else {
            // A trail leaving the left edge re-enters from the right; one
            // leaving the sill re-enters from the top. Both edges stay active.
            meteor.x = edge === 'right' ? random(1146, 1200)
              : meteor.strength === 'warm' ? random(800, 1144) : random(140, 1144);
            meteor.y = edge === 'right'
              ? meteor.strength === 'warm' ? random(15, 220) : random(0, 400)
              : random(-35, -3);
            meteor.speed = meteor.strength === 'faint' ? random(105, 270)
              : meteor.strength === 'strong' ? random(380, 640)
              : meteor.strength === 'warm' ? random(690, 940) : random(220, 450);
            if (meteor.strength === 'warm') meteor.colorTime = 0;
          }
          positionMeteor(meteor);
        }

        function clearMeteors() {
          for (const meteor of meteors) meteor.group.remove();
          meteors.length = 0;
        }

        function fillSky() {
          clearMeteors();
          for (let i = 0; i < WARM_METEOR_COUNT; i++) makeMeteor('warm');
          const strongCount = Math.round(NORMAL_METEOR_COUNT * 13 / 94);
          const mediumCount = Math.round(NORMAL_METEOR_COUNT * 28 / 94);
          for (let i = 0; i < NORMAL_METEOR_COUNT; i++) {
            makeMeteor(i < strongCount ? 'strong' : i < strongCount + mediumCount ? 'medium' : 'faint');
          }
        }

        function surfaceAt(x) {
          const at = clamp((x - SAND_LEFT) / (SAND_RIGHT - SAND_LEFT) * (sandHeights.length - 1), 0, sandHeights.length - 1);
          const left = Math.floor(at);
          return mix(sandHeights[left], sandHeights[Math.min(left + 1, sandHeights.length - 1)], at - left);
        }

        function landingSpot() {
          // A handful of random probes makes each new star favor a hollow in
          // the pile, without putting the stars into visible rows or columns.
          let bestX = random(576, 641);
          let bestScore = Infinity;
          for (let i = 0; i < 7; i++) {
            const x = random(576, 641);
            const score = surfaceAt(x) + random(-5, 8);
            if (score < bestScore) { bestScore = score; bestX = x; }
          }
          return { x: bestX, y: SAND_FLOOR - surfaceAt(bestX) - random(4, 7) };
        }

        function updateSandPath() {
          let d = `M ${SAND_LEFT} ${SAND_FLOOR}`;
          for (let i = 0; i < sandHeights.length; i++) {
            const x = SAND_LEFT + i * SAND_STEP;
            const ripple = i === 0 || i === sandHeights.length - 1 ? 0 : Math.sin(i * 2.17) * .75;
            d += ` L ${x.toFixed(1)} ${(SAND_FLOOR - sandHeights[i] + ripple).toFixed(1)}`;
          }
          const shape = `${d} L ${SAND_RIGHT} ${SAND_FLOOR} Z`;
          sandBed.setAttribute('d', shape);
          sandFront.setAttribute('d', shape);
          const pileTop = Math.max(...sandHeights);
          pileHalo.setAttribute('cy', (SAND_FLOOR - pileTop + 3).toFixed(1));
          pileHalo.setAttribute('opacity', stars.length ? Math.min(.9, .57 + stars.length * .045).toFixed(2) : '0');
        }

        function addSandKernel(center, radius, mass) {
          const weights = sandHeights.map((_, i) => {
            const distance = (SAND_LEFT + i * SAND_STEP - center) / radius;
            return Math.exp(-.5 * distance * distance);
          });
          const total = weights.reduce((sum, weight) => sum + weight, 0);
          weights.forEach((weight, i) => { sandHeights[i] += mass * weight / total; });
        }

        function relaxSand(factor) {
          // Each transfer preserves the sum of the height field. A limited
          // slope gives the loose pieces a visible angle of repose.
          for (let direction = 0; direction < 2; direction++) {
            for (let n = 0; n < sandHeights.length - 1; n++) {
              const i = direction ? sandHeights.length - 2 - n : n;
              const slope = sandHeights[i] - sandHeights[i + 1];
              if (Math.abs(slope) <= 2.25) continue;
              const transfer = (Math.abs(slope) - 2.25) * factor * Math.sign(slope);
              sandHeights[i] -= transfer;
              sandHeights[i + 1] += transfer;
            }
          }
        }

        function updateSandPhysics(dt) {
          for (let i = sandTransfers.length - 1; i >= 0; i--) {
            const flow = sandTransfers[i];
            flow.age = Math.min(flow.duration, flow.age + dt);
            const progress = smooth(flow.age / flow.duration);
            addSandKernel(flow.center, flow.radius, flow.mass * (progress - flow.applied));
            flow.applied = progress;
            if (flow.age >= flow.duration) sandTransfers.splice(i, 1);
          }
          relaxSand(Math.min(.16, dt * 17));
        }

        function depositSand(x, instant = false) {
          // Excavation makes the struck peak fall even though a new star adds
          // material. The excavated amount and the new material travel to
          // both sides; no existing sand disappears.
          let excavated = 0;
          for (let i = 0; i < sandHeights.length; i++) {
            const distance = (SAND_LEFT + i * SAND_STEP - x) / 6.5;
            const removed = Math.min(sandHeights[i] * .31, 7.2 * Math.exp(-.5 * distance * distance));
            sandHeights[i] -= removed;
            excavated += removed;
          }
          const newMass = random(34, 43);
          addSandKernel(x, 7, newMass * .13);

          const leftHeight = surfaceAt(591);
          const rightHeight = surfaceAt(627);
          const leftShare = clamp(.5 + (rightHeight - leftHeight) / 65, .39, .61);
          const outwardMass = excavated + newMass * .87;
          const leftX = mix(x - 14, 596, .8);
          const rightX = mix(x + 14, 622, .8);
          const flows = [
            { center: leftX, radius: 13, mass: outwardMass * leftShare },
            { center: rightX, radius: 13, mass: outwardMass * (1 - leftShare) }
          ];
          for (const flow of flows) {
            if (instant) addSandKernel(flow.center, flow.radius, flow.mass);
            else sandTransfers.push({ ...flow, age: 0, applied: 0, duration: random(.36, .52) });
          }

          for (const star of stars) {
            if (!star.exposed || Math.abs(star.x - x) > 30) continue;
            star.vx += (star.x < x ? -1 : 1) * random(20, 46);
          }
          for (const grain of grains) {
            if (Math.abs(grain.x - x) > 25) continue;
            grain.vx += (grain.x < x ? -1 : 1) * random(12, 34);
          }
          for (const piece of fragments) {
            if (!piece.settled || Math.abs(piece.x - x) > 26) continue;
            piece.settled = false;
            piece.vx += (piece.x < x ? -1 : 1) * random(15, 42);
            piece.vy = -random(25, 65);
          }

          // Grain coordinates follow the evolving surface so the depression
          // never leaves fixed dots suspended over the pile.
          for (let i = 0; i < 12; i++) {
            const gx = clamp(x + random(-25, 25), SAND_LEFT + 3, SAND_RIGHT - 3);
            const grain = svgElement('circle', {
              cx: gx.toFixed(2), cy: SAND_FLOOR,
              r: random(.3, 1.1).toFixed(2),
              fill: ['#fff0a9', '#ffd46d', '#ffa947', '#ffe583'][Math.floor(random(0, 4))],
              opacity: random(.46, .95).toFixed(2)
            });
            sandGrains.append(grain);
            grains.push({ element: grain, x: gx, depth: random(1.5, 13), vx: 0 });
          }
          if (instant) {
            for (let i = 0; i < 25; i++) relaxSand(.28);
            updateSandPath();
          }
        }

        function innerWalls(y) {
          const shoulder = clamp((y - 306) / 34, 0, 1);
          return {
            left: mix(575, 563, shoulder),
            right: mix(643, 655, shoulder)
          };
        }

        function chooseCapturePath(kind) {
          const rightEdge = kind === 'right';
          for (let attempt = 0; attempt < 120; attempt++) {
            const mouthX = kind === 'near' ? random(612, 635) : random(626, 641);
            const approachDuration = kind === 'near' ? random(1.08, 1.4)
              : kind === 'wide' ? random(1, 1.25) : random(1.15, 1.7);
            const drag = random(.06, .16);
            const gravity = kind === 'near' ? random(260, 430)
              : kind === 'wide' ? random(330, 500) : random(120, 300);
            // Three distinct edge routes: a nearby top fall, a wider top
            // sweep, and an occasional shallow entry from the right side.
            const startX = rightEdge ? 1148 : NaN;
            const startY = rightEdge ? NaN : -6;
            const mouthVx = rightEdge
              ? -(startX - mouthX) * drag / Math.expm1(drag * approachDuration)
              : kind === 'near' ? -random(115, 190) : -random(200, 295);
            const vy = rightEdge ? random(20, 85)
              : (306 - startY - .5 * gravity * approachDuration ** 2) / approachDuration;
            const mouthVy = vy + gravity * approachDuration;
            // Solve backward from the mouth. The first visible point is on
            // the window boundary, with no mid-sky pop-in or rim steering.
            const vx = mouthVx * Math.exp(drag * approachDuration);
            const edgeX = rightEdge ? startX
              : mouthX - mouthVx * Math.expm1(drag * approachDuration) / drag;
            const edgeY = rightEdge
              ? 306 - vy * approachDuration - .5 * gravity * approachDuration ** 2
              : startY;
            if (rightEdge ? edgeY < 8 || edgeY > 220
              : (kind === 'near' ? edgeX < 730 || edgeX > 850 : edgeX < 850 || edgeX > 1000)
                || vy < 15 || vy > 115) continue;

            // Follow the candidate into the current pile. Most routes must
            // land untouched; only the small wall-seeking group may reflect.
            let hitsWall = false;
            let reachesPile = false;
            for (let time = PHYSICS_STEP; time < .8; time += PHYSICS_STEP) {
              const x = mouthX + mouthVx * (1 - Math.exp(-drag * time)) / drag;
              const y = 306 + mouthVy * time + .5 * gravity * time * time;
              const walls = innerWalls(y);
              if (y >= 317 && (x <= walls.left + 3 || x >= walls.right - 3)) {
                hitsWall = true;
                break;
              }
              if (y >= SAND_FLOOR - surfaceAt(x) - 6) {
                reachesPile = true;
                break;
              }
            }
            if (rightEdge ? !hitsWall : hitsWall || !reachesPile) continue;
            return { startX: edgeX, startY: edgeY, vx, vy, drag, gravity, approachDuration };
          }
          // Deterministic edge fallback for the rare case that the current
          // pile shape rejects every sampled trajectory.
          const drag = .1;
          const gravity = kind === 'right' ? 190 : kind === 'wide' ? 420 : 400;
          const approachDuration = kind === 'right' ? 1.35 : kind === 'wide' ? 1.08 : 1.1;
          const mouthX = kind === 'wide' ? 638 : kind === 'right' ? 636 : 630;
          const mouthVx = kind === 'right'
            ? -(1148 - mouthX) * drag / Math.expm1(drag * approachDuration)
            : kind === 'wide' ? -240 : -165;
          const startY = kind === 'right'
            ? 306 - 45 * approachDuration - .5 * gravity * approachDuration ** 2
            : -6;
          const vy = kind === 'right' ? 45
            : (306 - startY - .5 * gravity * approachDuration ** 2) / approachDuration;
          return {
            startX: kind === 'right' ? 1148
              : mouthX - mouthVx * Math.expm1(drag * approachDuration) / drag,
            startY,
            vx: mouthVx * Math.exp(drag * approachDuration),
            vy,
            drag, gravity, approachDuration
          };
        }

        function launchCapture(kind, opening = false, clickedPoint = null) {
          if (captures.length >= (clickedPoint ? 7 : 2)) return false;
          if (!clickedPoint && stars.length + captures.length >= MAX_STARS) return false;
          const mouthX = clickedPoint ? clamp(610 + (clickedPoint.x - 610) * .035, 595, 625) : null;
          const route = clickedPoint ? {
            startX: clickedPoint.x,
            startY: clickedPoint.y,
            mouthX,
            vx: 0,
            vy: 155,
            drag: .1,
            gravity: 350,
            approachDuration: clamp(.72 + Math.abs(clickedPoint.x - mouthX) / 790, .72, 1.42)
          } : chooseCapturePath(kind);
          const hue = clickedPoint ? 'yellow' : Math.random() < .58 ? 'yellow' : 'orange';
          const gradientId = ++captureGradientId;
          const whiteGradient = curveWhite.cloneNode(true);
          const warmGradient = (hue === 'yellow' ? curveYellow : curveOrange).cloneNode(true);
          whiteGradient.id = `capture-white-${gradientId}`;
          warmGradient.id = `capture-warm-${gradientId}`;
          svgDefs.append(whiteGradient, warmGradient);
          const group = svgElement('g', { opacity: '.91' });
          const whiteGroup = svgElement('g', { opacity: '1' });
          const warmGroup = svgElement('g', { opacity: '0' });
          whiteGroup.append(
            svgElement('circle', { cx: 0, cy: 0, r: 12, fill: 'url(#white-halo)' }),
            svgElement('circle', { cx: 0, cy: 0, r: 1.58, fill: '#f7fbff' })
          );
          warmGroup.append(
            svgElement('circle', { cx: 0, cy: 0, r: 14, fill: `url(#${hue}-halo)` }),
            svgElement('circle', { cx: 0, cy: 0, r: 1.75, fill: hue === 'yellow' ? '#f2e7b4' : '#edcd9c' })
          );
          group.append(whiteGroup, warmGroup);
          const skyWhiteGlow = svgElement('path', { fill: `url(#${whiteGradient.id})`, filter: 'url(#tail-glow)' });
          const skyWarmGlow = svgElement('path', { fill: `url(#${warmGradient.id})`, filter: 'url(#tail-glow)' });
          const skyWhiteTail = svgElement('path', { fill: `url(#${whiteGradient.id})` });
          const skyWarmTail = svgElement('path', { fill: `url(#${warmGradient.id})` });
          const innerWhiteGlow = svgElement('path', { fill: `url(#${whiteGradient.id})`, filter: 'url(#tail-glow)' });
          const innerWarmGlow = svgElement('path', { fill: `url(#${warmGradient.id})`, filter: 'url(#tail-glow)' });
          const innerWhiteTail = svgElement('path', { fill: `url(#${whiteGradient.id})` });
          const innerWarmTail = svgElement('path', { fill: `url(#${warmGradient.id})` });
          approachLayer.append(skyWhiteGlow, skyWarmGlow, skyWhiteTail, skyWarmTail, group);
          bottleContent.append(innerWhiteGlow, innerWarmGlow, innerWhiteTail, innerWarmTail);
          captures.push({
            group, whiteGroup, warmGroup, hue, opening, manual: Boolean(clickedPoint), inside: false, elapsed: 0,
            ...route, x: route.startX, y: route.startY,
            history: [{ x: route.startX, y: route.startY, time: 0 }],
            mouthTime: Infinity,
            skyWhiteGlow, skyWarmGlow, innerWhiteGlow, innerWarmGlow,
            skyWhiteTail, skyWarmTail, innerWhiteTail, innerWarmTail,
            whiteGradient, warmGradient,
            restitution: random(.16, .43),
            impactOffset: random(4, 7)
          });
          return true;
        }

        function shardShape(size) {
          const sides = Math.floor(random(3, 6));
          const points = [];
          for (let i = 0; i < sides; i++) {
            const angle = i * Math.PI * 2 / sides + random(-.22, .22);
            const radius = size * random(.48, 1.04);
            points.push(`${(Math.cos(angle) * radius).toFixed(2)},${(Math.sin(angle) * radius * random(.6, 1.15)).toFixed(2)}`);
          }
          return points.join(' ');
        }

        function landStar(x, y, instant = false, hue = null, addMaterial = true) {
          hue = hue || (Math.random() < .58 ? 'yellow' : 'orange');
          const exposed = Math.random() < .42;
          const surfaceOffset = exposed ? random(3, 7) : random(-2, 1);
          const color = hue === 'yellow' ? '#ffe079' : '#f5ad53';
          const group = svgElement('g', {});
          const starShape = 'M 0 -13 C 1.6 -5 3 -3.4 5 -2.5 L 13 0 C 5 1.6 3.7 3 2.8 4.5 L 0 12 C -1.6 4.8 -3 3.5 -4.6 2.7 L -12 0 C -4 -1.5 -3 -3 -2.4 -5 Z';
          if (exposed) group.append(svgElement('path', {
            d: starShape, fill: color, opacity: '.5', filter: 'url(#meteor-glow)'
          }));
          group.append(svgElement('path', { d: starShape, fill: color }));
          if (addMaterial) depositSand(x, instant);
          stars.push({
            group, x, y: SAND_FLOOR - surfaceAt(x) - surfaceOffset,
            vx: 0, surfaceOffset, exposed, age: instant ? 1 : 0,
            sizeX: random(.69, .91), sizeY: random(.66, .88), angle: random(-32, 32),
            base: random(.91, .98), glow: random(.02, .06),
            phase: random(0, Math.PI * 2), rate: random(1.2, 2.8)
          });

          const shardColors = hue === 'yellow'
            ? ['#ffe583', '#ffc85a', '#fff2ad', '#f4ae42']
            : ['#ffc263', '#f99a3d', '#ffda81', '#eb8031'];
          const count = Math.floor(random(3, 6));
          for (let i = 0; i < count; i++) {
            const pieceGroup = svgElement('g', {});
            pieceGroup.append(svgElement('polygon', {
              points: shardShape(random(1.6, 3.7)),
              fill: shardColors[Math.floor(random(0, shardColors.length))]
            }));
            (Math.random() < .57 ? sandGrains : buriedPieces).append(pieceGroup);
            fragments.push({
              group: pieceGroup, x, y: Math.min(y, SAND_FLOOR - surfaceAt(x) - 4),
              vx: random(-72, 72), vy: instant ? 0 : -random(48, 115),
              settled: instant, surfaceOffset: random(1, 6),
              angle: random(-45, 45), spin: random(-135, 135),
              age: instant ? 1 : 0,
              base: random(.72, .91), glow: random(.04, .09),
              phase: random(0, Math.PI * 2), rate: random(1, 2.5)
            });
          }
          (exposed ? surfaceStars : buriedPieces).append(group);
        }

        function ribbonPath(points, time) {
          if (points.length < 2) return '';
          const left = [];
          const right = [];
          for (let i = 0; i < points.length; i++) {
            const point = points[i];
            const before = points[Math.max(0, i - 1)];
            const after = points[Math.min(points.length - 1, i + 1)];
            const dx = after.x - before.x;
            const dy = after.y - before.y;
            const length = Math.hypot(dx, dy) || 1;
            const age = clamp((point.time - (time - CAPTURE_TRAIL_TIME)) / CAPTURE_TRAIL_TIME, 0, 1);
            const width = .04 + 1.08 * age ** 1.2;
            const nx = -dy / length * width;
            const ny = dx / length * width;
            left.push(`${(point.x + nx).toFixed(2)} ${(point.y + ny).toFixed(2)}`);
            right.push(`${(point.x - nx).toFixed(2)} ${(point.y - ny).toFixed(2)}`);
          }
          return `M ${left.join(' L ')} L ${right.reverse().join(' L ')} Z`;
        }

        function launchSillMeteor(side) {
          const leftSide = side === 'left';
          const targetX = leftSide ? random(460, 485) : random(790, 950);
          const targetY = leftSide ? random(418, 426) : random(420, 444);
          const gradient = curveYellow.cloneNode(true);
          gradient.id = `sill-meteor-${++captureGradientId}`;
          svgDefs.append(gradient);

          const group = svgElement('g', {});
          const glow = svgElement('path', {
            fill: `url(#${gradient.id})`, opacity: '.66', filter: 'url(#tail-glow)'
          });
          const tail = svgElement('path', { fill: `url(#${gradient.id})`, opacity: '.96' });
          const head = svgElement('g', {});
          head.append(
            svgElement('circle', { cx: 0, cy: 0, r: 13, fill: 'url(#yellow-halo)' }),
            svgElement('circle', { cx: 0, cy: 0, r: 2, fill: '#f3e9b9' })
          );
          group.append(glow, tail, head);
          sillMeteorLayer.append(group);
          sillMeteor = {
            group, gradient, glow, tail, head, side, targetX, targetY,
            startX: leftSide ? targetX + 440
              : Math.min(1136, targetX + random(185, 245)),
            startY: -6, duration: nextSillDuration, elapsed: 0,
            history: [], impactAge: null
          };
        }

        function landSillStar(x, y, side) {
          const depth = clamp((y - 402) / 66, 0, 1);
          const scaleX = mix(.72, 1.32, depth);
          const scaleY = scaleX * mix(.42, .58, depth);
          const root = svgElement('g', {});
          const shadow = svgElement('ellipse', {
            cx: x.toFixed(2), cy: (y + 1).toFixed(2),
            rx: (11 * scaleX).toFixed(2), ry: (3.8 * scaleY).toFixed(2),
            fill: '#06172d', opacity: '.46'
          });
          const star = svgElement('g', {});
          const shape = 'M 0 -12 C 1.4 -4.5 3 -2.5 11 0 C 3 2 1.5 4.5 0 12 C -1.5 4.5 -3 2 -11 0 C -3 -2.5 -1.4 -4.5 0 -12 Z';
          star.append(
            svgElement('path', { d: shape, fill: '#eacf87', opacity: '.7', filter: 'url(#meteor-glow)' }),
            svgElement('path', { d: shape, fill: '#edd896' })
          );
          root.append(shadow, star);
          sillMeteorLayer.append(root);
          sillStar = { root, shadow, star, x, y, scaleX, scaleY, age: 0 };
          if (side === 'right') {
            // The wall shake is subpixel after SVG scaling; make this impact readable.
            triggerBottleShake(-1, 12, .36);
          }
        }

        function triggerBottleShake(side, strength = 1, duration = .24) {
          shakeTime = duration;
          shakeDuration = duration;
          shakeSide = side;
          shakeStrength = strength;
        }

        function removeSillMeteor() {
          if (!sillMeteor) return;
          sillMeteor.group.remove();
          sillMeteor.gradient.remove();
          sillMeteor = null;
        }

        function removeSillStar() {
          if (!sillStar) return;
          sillStar.root.remove();
          sillStar = null;
        }

        function updateSillMeteor(dt) {
          if (!sillMeteor) return;
          const meteor = sillMeteor;
          if (meteor.impactAge !== null) {
            meteor.impactAge += dt;
            meteor.group.setAttribute('opacity', (1 - clamp(meteor.impactAge / .22, 0, 1)).toFixed(3));
            if (meteor.impactAge >= .22) removeSillMeteor();
            return;
          }

          meteor.elapsed = Math.min(meteor.duration, meteor.elapsed + dt);
          const t = meteor.elapsed / meteor.duration;
          const position = meteor.side === 'left'
            ? leftSillPosition(meteor.targetX, meteor.targetY, t)
            : {
                x: mix(meteor.startX, meteor.targetX, t),
                y: mix(meteor.startY, meteor.targetY, .18 * t + .82 * t * t)
              };
          const { x, y } = position;
          meteor.history.push({ x, y, time: meteor.elapsed });
          while (meteor.history.length > 2 && meteor.history[1].time < meteor.elapsed - CAPTURE_TRAIL_TIME) {
            meteor.history.shift();
          }
          const shape = ribbonPath(meteor.history, meteor.elapsed);
          meteor.glow.setAttribute('d', shape);
          meteor.tail.setAttribute('d', shape);
          const oldest = meteor.history[0];
          meteor.gradient.setAttribute('x1', x.toFixed(2));
          meteor.gradient.setAttribute('y1', y.toFixed(2));
          meteor.gradient.setAttribute('x2', oldest.x.toFixed(2));
          meteor.gradient.setAttribute('y2', oldest.y.toFixed(2));
          meteor.head.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
          if (t >= 1) {
            landSillStar(meteor.targetX, meteor.targetY, meteor.side);
            nextSillSide = meteor.side === 'left' ? 'right' : 'left';
            scheduleSillMeteor(sillClock);
            meteor.head.remove();
            meteor.impactAge = 0;
          }
        }

        function updateSillStar(dt) {
          if (!sillStar) return;
          const star = sillStar;
          star.age += dt;
          const arrival = outCubic(clamp(star.age / .3, 0, 1));
          const pop = .25 + .75 * arrival;
          const fade = 1 - clamp((star.age - SILL_STAR_HOLD) / SILL_STAR_FADE, 0, 1);
          const twinkle = .9 + .1 * Math.sin(sceneTime * 5);
          star.star.setAttribute('transform',
            `translate(${star.x.toFixed(2)} ${(star.y - 10 * star.scaleY).toFixed(2)}) scale(${(star.scaleX * pop).toFixed(3)} ${(star.scaleY * pop).toFixed(3)})`);
          star.star.setAttribute('opacity', (fade * twinkle).toFixed(3));
          star.shadow.setAttribute('opacity', (.46 * fade * arrival).toFixed(3));
          if (star.age >= SILL_STAR_HOLD + SILL_STAR_FADE) removeSillStar();
        }

        function renderCapture(meteor) {
          const tailStart = meteor.elapsed - CAPTURE_TRAIL_TIME;
          while (meteor.history.length > 2 && meteor.history[1].time < tailStart) meteor.history.shift();
          const skyPoints = meteor.history.filter(point => point.time <= meteor.mouthTime);
          const innerPoints = meteor.history.filter(point => point.time >= meteor.mouthTime);
          const skyShape = ribbonPath(skyPoints, meteor.elapsed);
          const innerShape = ribbonPath(innerPoints, meteor.elapsed);
          for (const tail of [meteor.skyWhiteGlow, meteor.skyWarmGlow, meteor.skyWhiteTail, meteor.skyWarmTail]) {
            tail.setAttribute('d', skyShape);
          }
          for (const tail of [meteor.innerWhiteGlow, meteor.innerWarmGlow, meteor.innerWhiteTail, meteor.innerWarmTail]) {
            tail.setAttribute('d', innerShape);
          }

          const oldest = meteor.history[0];
          for (const gradient of [meteor.whiteGradient, meteor.warmGradient]) {
            gradient.setAttribute('x1', meteor.x.toFixed(2));
            gradient.setAttribute('y1', meteor.y.toFixed(2));
            gradient.setAttribute('x2', oldest.x.toFixed(2));
            gradient.setAttribute('y2', oldest.y.toFixed(2));
          }
          const approachT = clamp(meteor.elapsed / meteor.approachDuration, 0, 1);
          const warm = meteor.manual ? 1 : smooth(clamp((approachT - .16) / .68, 0, 1));
          meteor.whiteGroup.setAttribute('opacity', (1 - warm).toFixed(3));
          meteor.warmGroup.setAttribute('opacity', warm.toFixed(3));
          for (const tail of [meteor.skyWhiteTail, meteor.innerWhiteTail]) {
            tail.setAttribute('opacity', ((1 - warm) * .9).toFixed(3));
          }
          for (const tail of [meteor.skyWarmTail, meteor.innerWarmTail]) {
            tail.setAttribute('opacity', (warm * .9).toFixed(3));
          }
          for (const tail of [meteor.skyWhiteGlow, meteor.innerWhiteGlow]) {
            tail.setAttribute('opacity', ((1 - warm) * .48).toFixed(3));
          }
          for (const tail of [meteor.skyWarmGlow, meteor.innerWarmGlow]) {
            tail.setAttribute('opacity', (warm * .52).toFixed(3));
          }
          meteor.group.setAttribute('transform',
            `translate(${meteor.x.toFixed(2)} ${meteor.y.toFixed(2)}) scale(${(1 + .35 * warm).toFixed(3)})`);
        }

        function removeCaptureVisual(meteor) {
          meteor.group.remove();
          meteor.skyWhiteTail.remove();
          meteor.skyWarmTail.remove();
          meteor.innerWhiteTail.remove();
          meteor.innerWarmTail.remove();
          meteor.skyWhiteGlow.remove();
          meteor.skyWarmGlow.remove();
          meteor.innerWhiteGlow.remove();
          meteor.innerWarmGlow.remove();
          meteor.whiteGradient.remove();
          meteor.warmGradient.remove();
        }

        function updateCapture(meteor, dt) {
          const previousX = meteor.x;
          const previousY = meteor.y;
          if (meteor.manual && !meteor.inside) {
            meteor.elapsed += dt;
            const progress = clamp(meteor.elapsed / meteor.approachDuration, 0, 1);
            const bend = meteor.startX > meteor.mouthX ? 1 : -1;
            meteor.x = cubic(meteor.startX, meteor.startX, meteor.mouthX + bend * 82, meteor.mouthX, progress);
            meteor.y = cubic(
              meteor.startY,
              meteor.startY + (306 - meteor.startY) * .32 - 32,
              Math.min(246, meteor.startY + (306 - meteor.startY) * .78),
              306,
              progress
            );
            if (progress === 1) {
              meteor.x = meteor.mouthX;
              meteor.y = 306;
              meteor.mouthTime = meteor.elapsed;
              meteor.inside = true;
              meteor.vx = clamp((610 - meteor.mouthX) * .7, -18, 18);
              bottleContent.append(meteor.group);
            }
            meteor.history.push({ x: meteor.x, y: meteor.y, time: meteor.elapsed });
            renderCapture(meteor);
            return;
          }
          const dragDecay = Math.exp(-meteor.drag * dt);
          meteor.x += meteor.vx * (1 - dragDecay) / meteor.drag;
          meteor.vx *= dragDecay;
          meteor.y += meteor.vy * dt + .5 * meteor.gravity * dt * dt;
          meteor.vy += meteor.gravity * dt;
          meteor.elapsed += dt;

          // Crossing the rim changes only the SVG layer. Position and
          // velocity continue from the same equations on both sides.
          if (!meteor.inside && previousY < 306 && meteor.y >= 306) {
            const fraction = (306 - previousY) / (meteor.y - previousY);
            const crossingX = mix(previousX, meteor.x, fraction);
            if (crossingX < 579 || crossingX > 642) {
              removeCaptureVisual(meteor);
              captures.splice(captures.indexOf(meteor), 1);
              return;
            }
            meteor.mouthTime = meteor.elapsed - dt + fraction * dt;
            meteor.history.push({ x: crossingX, y: 306, time: meteor.mouthTime });
            bottleContent.append(meteor.group);
            meteor.inside = true;
          }

          if (meteor.inside && meteor.y >= 317) {
            const walls = innerWalls(meteor.y);
            if (meteor.x < walls.left + 3 && meteor.vx < 0) {
              meteor.x = walls.left + 3;
              meteor.vx = -meteor.vx * meteor.restitution;
              triggerBottleShake(-1);
            } else if (meteor.x > walls.right - 3 && meteor.vx > 0) {
              meteor.x = walls.right - 3;
              meteor.vx = -meteor.vx * meteor.restitution;
              triggerBottleShake(1);
            }
          }

          meteor.history.push({ x: meteor.x, y: meteor.y, time: meteor.elapsed });
          renderCapture(meteor);

          const pileY = SAND_FLOOR - surfaceAt(meteor.x) - meteor.impactOffset;
          if (meteor.inside && meteor.y >= pileY) {
            const earlierPileY = SAND_FLOOR - surfaceAt(previousX) - meteor.impactOffset;
            const denominator = (meteor.y - previousY) - (pileY - earlierPileY);
            const fraction = denominator > 0 ? clamp((earlierPileY - previousY) / denominator, 0, 1) : 1;
            const impactX = mix(previousX, meteor.x, fraction);
            const impactY = SAND_FLOOR - surfaceAt(impactX) - meteor.impactOffset;
            removeCaptureVisual(meteor);
            captures.splice(captures.indexOf(meteor), 1);
            if (stars.length < 2) {
              triggerBottleShake(impactX < 609 ? -1 : 1, 6, .32);
            }
            const replacingStar = meteor.manual && stars.length >= MAX_STARS;
            if (replacingStar) {
              stars.shift().group.remove();
            }
            landStar(clamp(impactX, 568, 651), impactY, false, meteor.hue, !replacingStar);
            while (fragments.length > MAX_STARS * 6) fragments.shift().group.remove();
            if (meteor.opening && ++openingLandings === OPENING_CAPTURES.length) {
              openingCapturesActive = false;
              captureWave = OPENING_CAPTURES.length;
              nextCapture = random(4.5, 6.5) / CAPTURE_RATE_MULTIPLIER;
            }
            if (window.parent !== window) {
              window.parent.postMessage({ type: 'portfolio-scene:star-impact' }, '*');
            }
          }
        }

        function updateShake(elapsed) {
          shakeTime = Math.max(0, shakeTime - elapsed);
          if (!shakeTime) {
            bottleScene.setAttribute('transform', '');
            shakeDuration = .24;
            shakeStrength = 1;
            return;
          }
          const progress = 1 - shakeTime / shakeDuration;
          const motion = Math.cos(progress * Math.PI * 2.2) * (1 - progress) ** 1.4 * shakeSide * shakeStrength;
          const dx = .46 * motion;
          const angle = .085 * motion;
          bottleScene.setAttribute('transform',
            `translate(${dx.toFixed(3)} ${(Math.abs(motion) * .06).toFixed(3)}) rotate(${angle.toFixed(3)} 609 425)`);
        }

        function showRabbitFrame(pose) {
          rabbitFrames.forEach((rabbitFrame, index) => {
            rabbitFrame.setAttribute('visibility', index === pose ? 'visible' : 'hidden');
          });
          linePaths.forEach((path, index) => {
            path.setAttribute('d', linePosePaths[index][pose]);
          });
        }

        function updateRabbit(elapsed) {
          rabbitFrameElapsed += elapsed;
          const steps = Math.floor(rabbitFrameElapsed / RABBIT_FRAME_SECONDS);
          if (!steps) return;
          rabbitFrameElapsed -= steps * RABBIT_FRAME_SECONDS;
          rabbitSequenceIndex = (rabbitSequenceIndex + steps) % RABBIT_SEQUENCE.length;
          showRabbitFrame(RABBIT_SEQUENCE[rabbitSequenceIndex]);
        }

        function resetRabbit() {
          rabbitSequenceIndex = 0;
          rabbitFrameElapsed = 0;
          showRabbitFrame(RABBIT_SEQUENCE[0]);
        }

        function updateSparkles() {
          if (!stars.length) return;
          const anchors = [587, 632];
          for (let i = 0; i < sparkleMarks.length; i++) {
            const x = anchors[i];
            const y = SAND_FLOOR - surfaceAt(x) - (i ? 5 : 8);
            const pulse = Math.max(0, Math.sin(sceneTime * (i ? 3.1 : 2.4) + (i ? 1.8 : .1))) ** 5;
            sparkleMarks[i].setAttribute('transform',
              `translate(${x} ${y.toFixed(2)}) scale(${(.55 + .38 * pulse).toFixed(3)})`);
            sparkleMarks[i].setAttribute('opacity', (.08 + .88 * pulse).toFixed(3));
          }
        }

        function stepPilePhysics(dt) {
          updateSandPhysics(dt);
          let visibleCount = stars.filter(star => star.exposed).length;
          for (const star of stars) {
            if (!star.exposed) continue;
            star.x = clamp(star.x + star.vx * dt, 573, 646);
            star.vx *= Math.exp(-7 * dt);
            const surfaceY = SAND_FLOOR - surfaceAt(star.x);
            if (surfaceY < star.y - 10 && visibleCount > 3) {
              buriedPieces.append(star.group);
              star.exposed = false;
              star.vx = 0;
              visibleCount--;
            } else {
              const targetY = surfaceY - star.surfaceOffset;
              star.y += (targetY - star.y) * (1 - Math.exp(-16 * dt));
            }
          }

          for (const piece of fragments) {
            if (piece.settled) {
              piece.y += (SAND_FLOOR - surfaceAt(piece.x) - piece.surfaceOffset - piece.y)
                * (1 - Math.exp(-14 * dt));
              continue;
            }
            piece.vy += 490 * dt;
            piece.vx *= Math.exp(-1.7 * dt);
            piece.x += piece.vx * dt;
            piece.y += piece.vy * dt;
            if (piece.x < 568 || piece.x > 651) {
              piece.x = clamp(piece.x, 568, 651);
              piece.vx *= -.27;
            }
            const surfaceY = SAND_FLOOR - surfaceAt(piece.x) - piece.surfaceOffset;
            if (piece.y >= surfaceY && piece.vy > 0) {
              piece.y = surfaceY;
              if (piece.vy > 48) piece.vy *= -.17;
              else { piece.vy = 0; piece.vx = 0; piece.settled = true; }
            }
          }
          for (const grain of grains) {
            grain.x = clamp(grain.x + grain.vx * dt, SAND_LEFT + 3, SAND_RIGHT - 3);
            grain.vx *= Math.exp(-8 * dt);
          }
        }

        function updatePile(elapsed) {
          for (const star of stars) {
            star.age += elapsed;
            const t = clamp(star.age / .38, 0, 1);
            const pop = t < .45 ? .24 + .94 * outCubic(t / .45)
              : 1.18 - .18 * outCubic((t - .45) / .55);
            const y = star.y - (1 - t) * 3;
            star.group.setAttribute('transform',
              `translate(${star.x.toFixed(2)} ${y.toFixed(2)}) rotate(${star.angle.toFixed(2)}) scale(${(star.sizeX * pop).toFixed(3)} ${(star.sizeY * pop).toFixed(3)})`);
            star.group.setAttribute('opacity',
              clamp(star.base + star.glow * Math.sin(sceneTime * star.rate + star.phase), .4, 1).toFixed(3));
          }

          for (const piece of fragments) {
            piece.age += elapsed;
            piece.group.setAttribute('transform',
              `translate(${piece.x.toFixed(2)} ${piece.y.toFixed(2)}) rotate(${(piece.angle + piece.spin * Math.min(piece.age, .45)).toFixed(2)})`);
            piece.group.setAttribute('opacity',
              clamp(piece.base + piece.glow * Math.sin(sceneTime * piece.rate + piece.phase), .35, .98).toFixed(3));
          }
          for (const grain of grains) {
            grain.element.setAttribute('cx', grain.x.toFixed(2));
            grain.element.setAttribute('cy', clamp(SAND_FLOOR - surfaceAt(grain.x) + grain.depth, 344, 423).toFixed(2));
          }
        }

        function seedStillBottle() {
          if (stars.length) return;
          for (let i = 0; i < 6; i++) {
            const spot = landingSpot();
            landStar(spot.x, spot.y, true);
          }
          let visible = stars.filter(star => star.exposed).length;
          for (const star of stars) {
            if (visible >= 3) break;
            if (star.exposed) continue;
            star.exposed = true;
            star.surfaceOffset = random(3, 6);
            surfaceStars.append(star.group);
            visible++;
          }
          for (const star of stars) {
            if (star.exposed) star.y = SAND_FLOOR - surfaceAt(star.x) - star.surfaceOffset;
          }
          for (const piece of fragments) {
            if (piece.settled) piece.y = SAND_FLOOR - surfaceAt(piece.x) - piece.surfaceOffset;
          }
          updatePile(0);
          updateSparkles();
        }

        function tick(time) {
          frame = 0;
          if (document.hidden || reducedMotion.matches || pausedByHost) return;
          const elapsed = previousTime ? Math.min((time - previousTime) / 1000, .05) : 0;
          const sillElapsed = previousSillTime ? Math.max(0, (time - previousSillTime) / 1000) : 0;
          previousTime = time;
          previousSillTime = time;
          sceneTime += elapsed;
          sillClock += sillElapsed;

          for (const meteor of meteors) {
            if (meteor.strength === 'warm' && !meteor.active) {
              meteor.cooldown -= elapsed;
              if (meteor.cooldown <= 0) {
                meteor.active = true;
                meteor.group.removeAttribute('display');
                placeMeteor(meteor, 'right');
              }
              continue;
            }
            if (meteor.strength === 'warm') meteor.colorTime += elapsed;
            meteor.x -= meteor.speed * elapsed;
            meteor.y += meteor.speed * meteor.slope * elapsed;
            if (meteor.strength === 'warm' &&
                (meteor.x + meteor.length < 138 || meteor.y - meteor.length * meteor.slope > 400)) {
              meteor.active = false;
              meteor.cooldown = random(6, 10);
              meteor.group.setAttribute('display', 'none');
            } else if (meteor.x + meteor.length < 138) {
              placeMeteor(meteor, 'right');
            } else if (meteor.y - meteor.length * meteor.slope > 400) {
              placeMeteor(meteor, 'top');
            } else {
              positionMeteor(meteor);
            }
          }

          physicsRemainder += elapsed;
          while (physicsRemainder >= PHYSICS_STEP) {
            if (openingCapturesActive) {
              const event = OPENING_CAPTURES[openingCaptureIndex];
              if (event && sceneTime >= event.at && launchCapture(event.kind, true)) {
                openingCaptureIndex++;
              }
            } else if (stars.length + captures.length < MAX_STARS) {
              nextCapture -= PHYSICS_STEP;
              if (nextCapture <= 0) {
                const kinds = ['near', 'wide', 'right', 'near', 'wide'];
                const kind = kinds[captureWave % kinds.length];
                if (launchCapture(kind)) {
                  captureWave++;
                  // The third wave is deliberately a pair; later pairs are rare.
                  if (captureWave === 3 || (captureWave > 3 && Math.random() < .16)) {
                    pairKind = kind === 'wide' ? 'near' : 'wide';
                    pairDelay = random(.2, .42);
                  }
                  nextCapture = random(4.5, 6.5) / CAPTURE_RATE_MULTIPLIER;
                }
              }
            }
            if (pairDelay >= 0) {
              pairDelay -= PHYSICS_STEP;
              if (pairDelay < 0) launchCapture(pairKind);
            }
            for (const meteor of [...captures]) updateCapture(meteor, PHYSICS_STEP);
            stepPilePhysics(PHYSICS_STEP);
            physicsRemainder -= PHYSICS_STEP;
          }
          updateSandPath();
          updatePile(elapsed);
          updateSparkles();
          updateShake(elapsed);
          updateRabbit(sillElapsed);
          if (nextSillMeteorAt !== null && sillClock >= nextSillMeteorAt && !sillMeteor) {
            launchSillMeteor(nextSillSide);
          }
          updateSillMeteor(sillElapsed);
          updateSillStar(sillElapsed);

          frame = requestAnimationFrame(tick);
        }

        function stop() {
          if (frame) cancelAnimationFrame(frame);
          frame = 0;
          previousTime = 0;
          previousSillTime = 0;
          physicsRemainder = 0;
          shakeTime = 0;
          shakeDuration = .24;
          shakeStrength = 1;
          if (sillMeteor && sillMeteor.impactAge === null) nextSillMeteorAt = sillClock;
          removeSillMeteor();
          removeSillStar();
          bottleScene.setAttribute('transform', '');
          resetRabbit();
        }

        function start() {
          if (!frame && !document.hidden && !reducedMotion.matches && !pausedByHost) {
            previousSillTime = performance.now();
            frame = requestAnimationFrame(tick);
          }
        }

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent) return;
          if (location.protocol !== 'file:' && event.origin !== location.origin) return;
          if (event.data?.type === 'portfolio-scene:pause') {
            pausedByHost = true;
            stop();
          } else if (event.data?.type === 'portfolio-scene:resume') {
            pausedByHost = false;
            start();
          } else if (event.data?.type === 'portfolio-scene:interactive-star') {
            if (document.hidden || reducedMotion.matches || pausedByHost) return;
            const { x, y } = event.data;
            if (!Number.isFinite(x) || !Number.isFinite(y)) return;
            const matrix = sceneSvg.getScreenCTM();
            if (!matrix) return;
            const point = sceneSvg.createSVGPoint();
            point.x = x;
            point.y = y;
            const origin = point.matrixTransform(matrix.inverse());
            if (origin.x < 141 || origin.x > 1142 || origin.y < 5 || origin.y > 395) return;
            if (origin.y > 295 && origin.x > 550 && origin.x < 735) return;
            if (launchCapture('interactive', false, origin)) {
              window.parent.postMessage({ type: 'portfolio-scene:interactive-star' }, '*');
            }
          }
        });

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) stop();
          else start();
        });
        reducedMotion.addEventListener('change', () => {
          stop();
          for (const meteor of captures) removeCaptureVisual(meteor);
          captures.length = 0;
          openingCapturesActive = false;
          pairDelay = -1;
          if (reducedMotion.matches) {
            nextSillMeteorAt = null;
            fillSky();
            seedStillBottle();
          } else {
            nextCapture = 2.2 / CAPTURE_RATE_MULTIPLIER;
            captureWave = OPENING_CAPTURES.length;
            scheduleSillMeteor(sillClock);
            start();
          }
        });

        scheduleSillMeteor(sillClock);
        fillSky();
        if (reducedMotion.matches) seedStillBottle();
        start();
      })();
    </script>
  </body>
</html>
